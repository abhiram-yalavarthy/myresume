name: Deploy static site to gh-pages

# Ensure GITHUB_TOKEN has necessary permissions
permissions:
  contents: write    # allow pushes
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (persist credentials so GITHUB_TOKEN can push)
        uses: actions/checkout@v4
        with:
          # persist-credentials must be true so the action runner can push using GITHUB_TOKEN
          persist-credentials: true
          fetch-depth: 0

      # Optional: run build step here if you need it
      # - name: Build (optional)
      #   run: npm ci && npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./            # where your index.html is
          publish_branch: gh-pages
          # If you prefer to use a PAT instead of GITHUB_TOKEN, replace the next line with:
          # personal_access_token: ${{ secrets.PAT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
